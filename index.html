<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드래프트 룸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Lilita+One&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* 레이아웃: 좌측 맵 라이브러리 / 우측 분석 브로드캐스트 패널. 단일 다크 테마(e스포츠 방송 화면) */
:root{
  --bg:#0b0a1f; --bg2:#141235; --panel:#1b1846; --line:#2e2a6b;
  --fg:#f3f1ff; --dim:#9c97d6; --gold:#ffcf1f; --gold2:#ff9f1c;
  --blue:#2ea8ff; --red:#ff3d6e; --green:#36e39b; --violet:#9b5cff;
  --f-display:"Lilita One","Black Han Sans",system-ui,sans-serif;
  --f-ko:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body)}
body{min-height:100vh;overflow-x:hidden}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 0 14px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--f-display);font-size:clamp(28px,4vw,46px);line-height:1;letter-spacing:.5px;
  background:linear-gradient(180deg,#fff7c2,var(--gold) 45%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #6b2f00) drop-shadow(0 0 18px rgba(255,207,31,.35));transform:skew(-6deg)}
.logo small{display:block;font-family:var(--f-ko);font-size:.38em;letter-spacing:6px;color:var(--fg);-webkit-text-fill-color:var(--fg);filter:none}
.live{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;font-family:var(--f-mono);font-size:12px}
.chip{border:1px solid var(--line);background:rgba(27,24,70,.7);padding:6px 10px;border-radius:999px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--fg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;box-shadow:0 0 10px var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

.grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;margin-top:18px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

/* library */
.lib{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 120px);position:sticky;top:12px}
@media(max-width:900px){.lib{position:static;max-height:520px}}
.lib>*{flex-shrink:0}
.lib h2{margin:0;font-family:var(--f-ko);font-weight:400;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.lib h2 span{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.search{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.modes{display:flex;gap:6px;flex-wrap:wrap;max-height:118px;overflow:auto}
.mode{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px 4px 4px;font-size:12px;cursor:pointer;white-space:nowrap}
.mode img{width:18px;height:18px}
.mode[aria-pressed="true"]{border-color:var(--gold);background:#2a2350;box-shadow:0 0 0 1px var(--gold) inset}
.toggle{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
.maps{overflow:auto;flex:1 1 auto;min-height:0;grid-auto-rows:max-content;align-content:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding-right:4px}
.mcard{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--bg);text-align:left;padding:0;transition:transform .15s}
.mcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.mcard[aria-current="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(255,207,31,.35)}
.mcard .th{height:74px;background-size:cover;background-position:center 40%;filter:saturate(1.2)}
.mcard .nm{padding:5px 7px 6px;font-size:12px;font-weight:700;line-height:1.2}
.mcard .nm small{display:block;font-size:9.5px;font-weight:400;color:var(--dim);font-family:var(--f-mono)}
.mapname small{display:block;font-family:var(--f-mono);font-size:13px;color:var(--dim);letter-spacing:1px;text-shadow:none;margin-top:6px}
.mapname.ko{font-family:var(--f-ko);font-weight:400}
.mcard .md{display:flex;gap:4px;align-items:center;font-size:10px;color:var(--dim);font-weight:400}
.mcard .md img{width:12px;height:12px}
.mcard .new{position:absolute;top:4px;right:4px;background:var(--red);font-size:9px;font-weight:900;padding:1px 5px;border-radius:4px}

/* stage */
.stage{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:18px;background:linear-gradient(135deg,var(--panel),#0f0d2b);border:1px solid var(--line);border-radius:20px;padding:16px;position:relative;overflow:hidden}
@media(max-width:640px){.hero{grid-template-columns:1fr}}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 200px at 80% -10%,var(--mode,rgba(155,92,255,.35)),transparent 70%);pointer-events:none;opacity:.6}
.mapbox{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:690/1050;max-height:460px;margin-inline:auto;width:100%}
.mapbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.scan{position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(180deg,transparent,rgba(54,227,155,.55),transparent);mix-blend-mode:screen}
.scanning .scan{animation:scan 1.4s ease-in-out 2}
@keyframes scan{to{top:100%}}
.hinfo{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.mapname{font-family:var(--f-display);font-size:clamp(30px,4.5vw,54px);line-height:.95;margin:0;text-wrap:balance;text-shadow:0 4px 0 #000}
.modeline{display:flex;align-items:center;gap:8px;font-family:var(--f-ko);font-size:18px}
.modeline img{width:28px;height:28px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
@media(max-width:1100px){.feat{grid-template-columns:1fr}}
.radar{width:100%;max-width:300px;margin-inline:auto}
.term{font-family:var(--f-mono);font-size:11.5px;background:#06051a;border:1px solid var(--line);border-radius:10px;padding:10px;height:170px;overflow:auto;color:#8af7c6;line-height:1.55}
.term .w{color:var(--gold)} .term .d{color:var(--dim)}

/* result */
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:18px;position:relative;overflow:hidden}
.card h3{margin:0 0 12px;font-family:var(--f-ko);font-weight:400;font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:6px;background:var(--gold);color:#2a1600;font-weight:700}
.best{border-color:rgba(255,207,31,.6);box-shadow:0 0 50px rgba(255,207,31,.12)}
.best::before{content:"";position:absolute;inset:-2px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--gold) 80%,transparent 90%);animation:spin 4s linear infinite;z-index:-1;opacity:.7}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.best>.inner{position:relative}
.teamrow{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
.br{flex:1 1 140px;max-width:200px;background:radial-gradient(circle at 50% 30%,var(--rc,#555) 0,transparent 70%),#0d0b26;border:2px solid var(--rc,#555);border-radius:16px;padding:10px;text-align:center;position:relative;transform-style:preserve-3d;transition:transform .2s;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.br:nth-child(2){animation-delay:.12s}.br:nth-child(3){animation-delay:.24s}.br:nth-child(4){animation-delay:.36s}.br:nth-child(5){animation-delay:.48s}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.br img{width:100%;max-width:120px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.br .n{font-family:var(--f-ko);font-size:20px;line-height:1.1}
.br .en{font-size:10px;color:var(--dim);font-family:var(--f-mono)}
.br .role{margin-top:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.45);border-radius:6px;padding:3px 6px}
.br .eff{margin-top:4px;font-family:var(--f-mono);font-size:11px;font-weight:700}
.br .eff.up{color:var(--green)} .br .eff.dn{color:var(--red)}
.br .pk{position:absolute;top:6px;left:6px;font-family:var(--f-mono);font-size:10px;background:#000a;border:1px solid var(--rc);border-radius:5px;padding:1px 5px}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:14px 0}
.big{font-family:var(--f-display);font-size:64px;line-height:.9;color:var(--gold);text-shadow:0 4px 0 #6b2f00}
.big small{font-size:18px;color:var(--fg);text-shadow:none}
.kpi{display:flex;flex-direction:column;font-size:12px;color:var(--dim)}
.kpi b{font-family:var(--f-display);font-size:28px;color:var(--fg);font-weight:400}
.bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px}
.bar{font-size:12px}
.bar .t{display:flex;justify-content:space-between;color:var(--dim)}
.bar .t b{color:var(--fg);font-family:var(--f-mono)}
.bar .tr{height:8px;background:#0a0920;border-radius:4px;overflow:hidden;margin-top:3px}
.bar .tr i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--violet),var(--blue));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar.hi .tr i{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.bar.lo .tr i{background:linear-gradient(90deg,#7a1230,var(--red))}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.box{background:#0d0b26;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.6;min-width:0}
.box h4{margin:0 0 6px;font-family:var(--f-ko);font-weight:400;font-size:15px;color:var(--gold)}
.box ul{margin:0;padding-left:18px}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini span{display:flex;align-items:center;gap:4px;background:#1b1846;border-radius:20px;padding:2px 8px 2px 2px;font-size:12px}
.mini img{width:24px;height:24px;border-radius:50%;background:#000}
.alts{display:grid;gap:10px}
.alt{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:#0d0b26;border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left}
.alt:hover{border-color:var(--gold)}
.alt .rk{font-family:var(--f-display);font-size:26px;color:var(--dim)}
.alt .ps{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.alt .ps img{width:40px;height:40px;object-fit:contain}
.alt .sc{font-family:var(--f-display);font-size:26px;color:var(--gold)}
.alt .ar{font-size:11px;color:var(--dim);width:100%}
.draft{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.draft{grid-template-columns:1fr}}
.draft .box{border-top:4px solid var(--bc)}
.draft .box h4{color:var(--bc);display:flex;justify-content:space-between;align-items:baseline}
.draft .box h4 span{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.draft select{width:100%}
.slots{display:flex;flex-direction:column;gap:6px;margin-top:8px;min-height:34px}
.slots .empty{font-size:12px;color:var(--dim);border:1px dashed var(--line);border-radius:8px;padding:6px 8px}
.picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.picker select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 8px;border-radius:20px;font-size:12px;border:1px solid}
.pill.e{border-color:var(--red);background:rgba(255,61,110,.12)}
.pill.m{border-color:var(--blue);background:rgba(46,168,255,.12)}
.pill.x{border-color:#666;background:rgba(120,120,120,.15)}
.pill button{background:none;border:0;cursor:pointer;padding:0 4px;color:var(--dim)}
.note{font-size:11px;color:var(--dim);margin-top:10px}
.loading{display:grid;place-items:center;min-height:60vh;font-family:var(--f-display);font-size:30px;color:var(--gold);text-align:center}
.loading small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.err{color:var(--red)}
footer{margin-top:28px;font-size:11px;color:var(--dim);text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header>
    <div class="logo">DRAFT ROOM<small>브롤스타즈 조합 연구소</small></div>
    <div class="live" id="live"><span class="chip"><span class="dot"></span>LIVE · Brawlify API 연결 중…</span></div>
  </header>
  <div id="app" class="loading">LOADING ARENA…<small>맵·브롤러 데이터를 불러오는 중</small></div>
  <footer>비공식 팬메이드 도구 · 맵·브롤러: Brawlify 공개 API · 현재 맵 풀과 맵별 승률 효과: BrawlTime (최근 4주) · 종합 점수와 추정 승률은 이 페이지 엔진의 계산값입니다.</footer>
</div>

<script src="engine/draft-engine.js"></script>
<script>
/* ===================== UI ===================== */
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

/* API 응답 캐시: 성공한 응답(필요한 필드만)을 localStorage에 저장해 두고, API가 실패하면 마지막 저장본으로 띄운다.
   저장소를 쓸 수 없는 환경(사생활 보호 모드 등)에서는 조용히 캐시 없이 동작한다. */
const CACHE_KEY='draftroom.cache.v1';
function readCache(){try{return JSON.parse(localStorage.getItem(CACHE_KEY))||null}catch(e){return null}}
function writeCache(v){try{localStorage.setItem(CACHE_KEY,JSON.stringify(v))}catch(e){}}
const slimMap=m=>({id:m.id,name:m.name,imageUrl:m.imageUrl,disabled:m.disabled,new:m.new,gameMode:{name:m.gameMode.name,imageUrl:m.gameMode.imageUrl,color:m.gameMode.color},environment:m.environment?{name:m.environment.name}:null});
const slimBrawler=b=>({id:b.id,name:b.name,imageUrl2:b.imageUrl2,released:b.released,class:b.class?{name:b.class.name}:null,rarity:b.rarity?{color:b.rarity.color}:null});
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status+' '+url);return r.json()}
async function loadSources(){
  const [m,b,s]=await Promise.allSettled([getJSON('https://api.brawlapi.com/v1/maps'),getJSON('https://api.brawlapi.com/v1/brawlers'),getJSON(BT+'/brawler-strength.json')]);
  const cache=readCache();
  const out={maps:null,brs:null,strength:null,cachedAt:null};
  if(m.status==='fulfilled'&&b.status==='fulfilled'){out.maps=m.value.list.map(slimMap);out.brs=b.value.list.map(slimBrawler)}
  else if(cache?.maps&&cache?.brs){out.maps=cache.maps;out.brs=cache.brs;out.cachedAt=cache.at}
  else throw (m.status==='rejected'?m.reason:b.reason);
  if(s.status==='fulfilled')out.strength=s.value;else if(cache?.strength){out.strength=cache.strength;out.cachedAt=out.cachedAt||cache.at}
  if(!out.cachedAt)writeCache({at:Date.now(),maps:out.maps,brs:out.brs,strength:out.strength});
  return out;
}

async function boot(){
  try{
    const src=await loadSources();
    const maps=src.maps, brs=src.brs, sJ=src.strength;
    DATA.cachedAt=src.cachedAt;
    buildData(maps,brs,sJ);
    const live=DATA.maps.filter(inPool).length;
    $('#live').innerHTML=`${DATA.cachedAt?'<span class="chip">OFFLINE</span>':'<span class="chip"><span class="dot"></span>LIVE</span>'}<span class="chip">${DATA.hasLive?'현재 맵 풀':'활성 맵'} <b>${live}</b> / 전체 <b>${DATA.maps.length}</b></span><span class="chip">브롤러 <b>${DATA.brawlers.length}</b></span>${DATA.window?`<span class="chip">실전 데이터 <b>${DATA.window}</b></span>`:'<span class="chip">실전 데이터 <b>연결 실패</b></span>'}${DATA.cachedAt?`<span class="chip" style="color:var(--gold)">API 응답 없음 · 저장본 사용 <b>${new Date(DATA.cachedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</b></span>`:`<span class="chip">동기화 <b>${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</b></span>`}`;
    renderShell();
    const first=DATA.maps.find(m=>inPool(m)&&RANKED.includes(m.mode))||DATA.maps[0];
    selectMap(first.id);
  }catch(e){
    $('#app').innerHTML=`<div class="err">데이터를 불러오지 못했습니다.<small>${esc(e.message)} · 인터넷 연결을 확인하고 새로고침하세요.</small></div>`;
  }
}
function renderShell(){
  const app=$('#app');app.className='grid';
  app.innerHTML=`<aside class="lib"><h2>맵 라이브러리 <span id="mcount"></span></h2>
    <input id="q" class="search" placeholder="맵 이름 검색 (한글·영문)…" autocomplete="off">
    <div class="modes" id="modes"></div>
    <label class="toggle"><input type="checkbox" id="ret"> 현재 맵 풀 밖의 맵도 보기 (은퇴·이벤트 맵)</label>
    <div class="maps" id="maps"></div></aside>
    <main class="stage" id="stage"></main>`;
  $('#q').oninput=e=>{STATE.q=e.target.value.toLowerCase();renderMaps()};
  $('#ret').onchange=e=>{STATE.retired=e.target.checked;renderModes();renderMaps()};
  renderModes();renderMaps();
}
function renderModes(){
  const box=$('#modes');box.innerHTML='';
  const mk=(key,label,img)=>{const b=el('button','mode',(img?`<img src="${img}" alt="">`:'')+esc(label));b.setAttribute('aria-pressed',STATE.mode===key);b.onclick=()=>{STATE.mode=key;renderModes();renderMaps()};box.append(b)};
  mk('RANKED','★ 랭크 모드');mk('ALL','전체');
  Object.values(DATA.modes).filter(m=>STATE.retired||m.live).sort((a,b)=>(RANKED.indexOf(a.name)+1||99)-(RANKED.indexOf(b.name)+1||99)||b.live-a.live).forEach(m=>mk(m.name,mko(m.name),m.img));
}
function renderMaps(){
  const list=DATA.maps.filter(m=>(STATE.retired||inPool(m))&&(STATE.mode==='ALL'||(STATE.mode==='RANKED'?RANKED.includes(m.mode):m.mode===STATE.mode))&&(!STATE.q||m.name.toLowerCase().includes(STATE.q)||mapKo(m).includes(STATE.q)));
  $('#mcount').textContent=list.length+'개';
  const box=$('#maps');box.innerHTML='';
  list.forEach(m=>{const b=el('button','mcard',`<div class="th" style="background-image:${mapImgs(m).map(u=>`url('${u}')`).concat('linear-gradient(135deg,#2e2a6b,#141235)').join(',')}"></div><div class="nm">${esc(mapKo(m))}${mapKo(m)!==m.name?`<small>${esc(m.name)}</small>`:''}<div class="md">${m.modeImg?`<img src="${m.modeImg}" alt="">`:''}${esc(mko(m.mode))}</div></div>${m.isNew?'<span class="new">NEW</span>':''}`);
    b.setAttribute('aria-current',STATE.map&&STATE.map.id===m.id);b.onclick=()=>selectMap(m.id);box.append(b)});
}
const FEAT_CACHE={}, STATS={};
// 맵별 실전 승률 효과 (BrawlTime, 최근 4주). 랭크 → 레전더리 트로피 → 트로피 순으로 사용
async function loadStats(m){
  if(!m.bt)return null;const k=m.bt.mode+'/'+m.bt.slug;if(k in STATS)return STATS[k];
  try{const r=await fetch(`${BT}/brawler-strength/${k}.json`);if(!r.ok)throw 0;STATS[k]=parseStats(await r.json())}catch(e){STATS[k]=null}
  return STATS[k];
}
function analyzeImage(img){
  const W=img.naturalWidth, H=img.naturalHeight;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0);
  return analyzePixels(cx.getImageData(0,0,W,H).data,W,H);
}
function selectMap(id){
  const m=DATA.maps.find(x=>x.id===id);STATE.map=m;STATE.lock=[];STATE.enemy=[];STATE.ban=[];
  document.querySelectorAll('.mcard').forEach(c=>c.setAttribute('aria-current','false'));renderMaps();
  const st=$('#stage');
  st.innerHTML=`<section class="hero" style="--mode:${m.color}55">
    <div><div class="mapbox scanning" id="mb"><img id="mimg" crossorigin="anonymous" alt="${esc(mapKo(m))} 맵"><div class="scan"></div></div></div>
    <div class="hinfo"><div class="eyebrow">MAP INTEL · #${m.id}${m.env?' · '+esc(m.env):''}</div>
      <h1 class="mapname${mapKo(m)!==m.name?' ko':''}">${esc(mapKo(m))}${mapKo(m)!==m.name?`<small>${esc(m.name)}</small>`:''}</h1>
      <div class="modeline">${m.modeImg?`<img src="${m.modeImg}" alt="">`:''}${esc(mko(m.mode))} <span class="chip">${modeProfile(m.mode).size===1?'솔로':modeProfile(m.mode).size+'인 팀'}</span>${m.live?'<span class="chip" style="color:var(--green)">● 현재 맵 풀</span>':'<span class="chip">맵 풀 밖</span>'}</div>
      <div class="feat"><svg class="radar" id="radar" viewBox="-130 -120 260 240"></svg><div class="term" id="term"></div></div></div></section>
    <section id="res"></section>`;
  const img=$('#mimg');
  STATE.stats=null;
  const go=feat=>{FEAT_CACHE[id]=feat;loadStats(m).then(st=>{if(STATE.map!==m)return;STATE.stats=st;runEngine(feat,true)})};
  // BrawlTime 이미지 우선 (Brawlify의 신규 맵 렌더는 골대가 빠지거나 어긋난 경우가 있음), 실패하면 Brawlify
  const srcs=mapImgs(m);let si=0;
  img.onload=()=>{if(FEAT_CACHE[id])return go(FEAT_CACHE[id]);try{go(analyzeImage(img))}catch(e){go(fallbackFeat(m.mode))}};
  img.onerror=()=>{if(si<srcs.length){img.src=srcs[si++];return}img.hidden=true;go(fallbackFeat(m.mode))};
  img.onerror();
  window.scrollTo({top:0,behavior:'smooth'});
}
function radar(f,dm){
  const ax=[['개방도',f.open],['벽 밀도',Math.min(1,f.wall*2.5)],['부쉬',Math.min(1,f.bush*3)],['시야선',f.sight],['중앙 개방',f.midOpen],['레인 분리',f.laneSplit],['투척 가치',dm.throw],['다이브 각',dm.dive]];
  const R=90,n=ax.length,pt=(i,v)=>[Math.sin(i/n*2*Math.PI)*R*v,-Math.cos(i/n*2*Math.PI)*R*v];
  let s='';[.25,.5,.75,1].forEach(l=>{s+=`<polygon points="${ax.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="#2e2a6b"/>`});
  ax.forEach((a,i)=>{const [x,y]=pt(i,1);const [lx,ly]=pt(i,1.22);s+=`<line x1="0" y1="0" x2="${x}" y2="${y}" stroke="#2e2a6b"/><text x="${lx}" y="${ly+4}" fill="#9c97d6" font-size="10" text-anchor="middle" font-family="Noto Sans KR">${a[0]}</text>`});
  const poly=ax.map((a,i)=>pt(i,Math.max(.05,a[1])).join(',')).join(' ');
  s+=`<polygon points="${poly}" fill="rgba(255,207,31,.25)" stroke="#ffcf1f" stroke-width="2"><animate attributeName="opacity" from="0" to="1" dur=".8s"/></polygon>`;
  ax.forEach((a,i)=>{const [x,y]=pt(i,Math.max(.05,a[1]));s+=`<circle cx="${x}" cy="${y}" r="3" fill="#ffcf1f"/>`});
  $('#radar').innerHTML=s;
}
function log(lines){
  const t=$('#term');t.innerHTML='';let i=0;
  const tick=()=>{if(i>=lines.length)return;const d=el('div','',lines[i++]);t.append(d);t.scrollTop=t.scrollHeight;setTimeout(tick,90+Math.random()*90)};tick();
}
function runEngine(feat,anim){
  const m=STATE.map, mp=modeProfile(m.mode), dm=demands(feat,mp);
  radar(feat,dm);
  const t0=performance.now();const R=solve(mp,dm);const ms=(performance.now()-t0).toFixed(0);
  if(anim)log([
    `<span class="d">$</span> draft-engine --map "${esc(mapKo(m))}" --mode ${esc(m.mode)}`,
    feat.ok?`> 타일 그리드 ${feat.cols}×${feat.rows} 스캔 · 커버 ${pct(feat.cover)}% · 부쉬 ${pct(feat.bush)}%`:`<span class="w">> 이미지 분석 실패 → 모드 기본값 사용</span>`,
    `> 최장 시야선 ${pct(feat.sight)}% · 중앙 개방 ${pct(feat.midOpen)}%`,
    `> 수요 벡터: 사거리 ${pct(dm.range)} / 투척 ${pct(dm.throw)} / 벽파괴 ${pct(dm.wb)} / 부쉬체크 ${pct(dm.bush)}`,
    STATE.stats?`<span class="w">> 실전 데이터: ${esc(STATE.stats.preset)} ${STATE.stats.battles.toLocaleString('ko-KR')}판 (${STATE.stats.from} ~ ${STATE.stats.until})</span>`:`> 실전 데이터 없음 → 프로필 기반 추정만 사용`,
    `> 브롤러 ${R.pool.length}명 개별 적합도 산출`,
    `> 카운터 매트릭스 ${R.pool.length}×${R.pool.length} 구성`,
    `> 조합 <span class="w">${R.count.toLocaleString('ko-KR')}</span>개 시뮬레이션 (${ms}ms)`,
    `> 역할 밸런스·시너지·카운터 내성 가중 합산`,
    `<span class="w">> TOP ${R.list.length} 조합 확정 ✔</span>`]);
  renderResult(R,mp,dm,feat);
}
function brCard(b,role,pk){
  return `<div class="br" style="--rc:${b.rarity}">${pk?`<span class="pk">${pk}</span>`:''}<img src="${b.img}" alt="${esc(b.name)}" loading="lazy"><div class="n">${esc(ko(b))}</div><div class="en">${esc(b.name)} · ${POSN[b.prof.p]}${b.prof.auto?' · <span title="직접 입력한 프로필이 없어 클래스 기본값으로 계산">추정 프로필</span>':''}</div><div class="role">${esc(role)}</div>${b.eff!=null?`<div class="eff ${b.eff>=0?'up':'dn'}">실전 ${b.eff>=0?'+':''}${(b.eff*100).toFixed(1)}%p</div>`:''}</div>`;
}
function renderResult(R,mp,dm,feat){
  const res=$('#res');if(!R.list.length){res.innerHTML='<div class="card">조건에 맞는 조합이 없습니다. 밴/고정 픽을 줄여 보세요.</div>';return}
  const best=R.list[0];const roles=assignRoles(best.team,mp);const order=draftOrder(best.team,dm);
  const wr=estWinRate(best);
  const fac=factorKeys(mp);
  // 위협·밴 추천
  const threats=banThreats(R,best,dm);
  const opts=R.pool.slice().sort((a,b)=>ko(a).localeCompare(ko(b),'ko')).map(b=>`<option value="${b.id}">${esc(ko(b))}</option>`).join('');
  // 상대 픽 후보: 밴·이미 고른 상대 제외 / 밴 후보: 이미 밴한 브롤러 제외
  const optList=f=>DATA.brawlers.filter(f).sort((a,b)=>ko(a).localeCompare(ko(b),'ko')).map(b=>`<option value="${b.id}">${esc(ko(b))}</option>`).join('');
  const optsEnemy=optList(b=>!STATE.ban.includes(b.id)&&!STATE.enemy.includes(b.id)), optsBan=optList(b=>!STATE.ban.includes(b.id));
  const pills=(arr,cls,empty)=>`<div class="slots">${arr.length?arr.map(id=>{const b=DATA.byId[id];return `<span class="pill ${cls}">${esc(ko(b))}<button data-rm="${cls}:${id}" aria-label="${esc(ko(b))} 제거">✕</button></span>`}).join(''):`<div class="empty">${empty}</div>`}</div>`;
  const mini=a=>`<div class="mini">${a.map(b=>`<span><img src="${b.img}" alt="">${esc(ko(b))}</span>`).join('')}</div>`;
  const mpN=mp.size;
  res.innerHTML=`
  <div class="card best"><div class="inner">
    <h3><span class="tag">S-TIER</span>최적 조합 · ${esc(archetype(best.team))}</h3>
    <div class="teamrow">${roles.map(r=>brCard(r.b,r.role,mpN>1?(order.indexOf(r.b)+1)+'픽':'')).join('')}</div>
    <div class="score"><div class="big" data-count="${best.score}">0<small> / 100</small></div>
      <div class="kpi">추정 승률<b>${wr}%</b></div><div class="kpi">시뮬레이션<b>${R.count.toLocaleString('ko-KR')}</b></div><div class="kpi">카운터 내성<b>${pct(best.f.counter)}</b></div></div>
    <div class="bars">${fac.map(k=>{const v=k==='mapN'?best.f.mapN:best.f[k];return `<div class="bar ${v>.72?'hi':v<.4?'lo':''}"><div class="t">${FLAB[k]}<b>${pct(v)}</b></div><div class="tr"><i data-w="${pct(v)}"></i></div></div>`}).join('')}</div>
    <div class="cols">
      <div class="box"><h4>왜 이 조합인가</h4><ul>${why(best,mp,dm,feat).map(s=>`<li>${s}</li>`).join('')}</ul></div>
      ${mpN>1?`<div class="box"><h4>드래프트 순서</h4><ul>${order.map((b,i)=>`<li><b>${i+1}픽</b> ${esc(ko(b))} — ${i===0?'카운터가 적어 블라인드 픽으로 안전':i===order.length-1?'카운터당하기 쉬워 마지막에 상대를 보고 확정':'중간 픽, 상대 첫 픽에 맞춰 교체 가능'}</li>`).join('')}</ul></div>`:''}
      <div class="box"><h4>밴 추천 · 이 조합의 천적</h4>${mini(threats.map(x=>x.e))}<div class="note">상위 메타 브롤러 중 이 조합을 가장 강하게 카운터하는 순서입니다.</div></div>
    </div>
  </div></div>

  <div class="card"><h3>드래프트 시뮬레이터</h3>
    <div class="draft">
      <div class="box" style="--bc:var(--blue)"><h4>① 우리 팀 고정 픽 <span>${STATE.lock.length}/${mpN}</span></h4><select id="selL" aria-label="우리 팀 고정 픽 추가"><option value="">이미 고른 브롤러 추가…</option>${opts}</select>${pills(STATE.lock,'m','비어 있음 · 고정하면 이 브롤러를 중심으로 나머지를 채웁니다')}</div>
      <div class="box" style="--bc:var(--red)"><h4>② 상대 팀 픽 <span>${STATE.enemy.length}/${mpN}</span></h4><select id="selE" aria-label="상대 팀 픽 추가"><option value="">상대 브롤러 추가…</option>${optsEnemy}</select>${pills(STATE.enemy,'e','비어 있음 · 넣으면 카운터 위주로 다시 계산합니다')}</div>
      <div class="box" style="--bc:#8a86b8"><h4>③ 밴 (양 팀 사용 불가) <span>${STATE.ban.length}</span></h4><select id="selB" aria-label="밴 추가"><option value="">밴할 브롤러 추가…</option>${optsBan}</select>${pills(STATE.ban,'x','비어 있음 · 밴한 브롤러는 추천에서 빠집니다')}</div>
    </div></div>

  <div class="card"><h3>대안 조합</h3><div class="alts">${R.list.slice(1).map((o,i)=>`<button class="alt" data-alt="${i+1}"><span class="rk">#${i+2}</span><span class="ps">${o.team.map(b=>`<img src="${b.img}" alt="${esc(b.name)}" title="${esc(ko(b))}">`).join('')}<span>${o.team.map(ko).map(esc).join(' · ')}</span><span class="ar">${esc(archetype(o.team))} · 맵 ${pct(o.f.mapN)} · 밸런스 ${pct(o.f.balance)} · 내성 ${pct(o.f.counter)}</span></span><span class="sc">${o.score}</span></button>`).join('')}</div>
  <div class="note">대안 조합을 누르면 위 메인 카드로 올립니다.</div></div>

  <div class="card"><h3>이 맵 개인 적합도 TOP 12</h3>${mini(R.pool.slice(0,12))}<div class="note">맵 수요 벡터 × 모드 가중치 × 메타 파워${STATE.stats?' + 실전 승률 효과':''}로 산출. 프로필이 없는 신규 브롤러는 클래스 기본값으로 계산합니다.${(()=>{const au=DATA.brawlers.filter(b=>b.prof.auto);return au.length?` (현재 ${au.length}명: ${au.map(b=>esc(ko(b))).join(', ')})`:''})()}</div></div>`;
  // 애니메이션
  requestAnimationFrame(()=>{document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%')});
  const big=res.querySelector('.big');const to=+big.dataset.count;let v=0;const ct=()=>{v=Math.min(to,v+Math.ceil((to-v)/8)||1);big.firstChild.nodeValue=v;if(v<to)requestAnimationFrame(ct)};ct();
  res.querySelectorAll('.br').forEach(c=>{c.onmousemove=e=>{const r=c.getBoundingClientRect();c.style.transform=`perspective(500px) rotateY(${(e.clientX-r.left)/r.width*20-10}deg) rotateX(${10-(e.clientY-r.top)/r.height*20}deg)`};c.onmouseleave=()=>c.style.transform=''});
  const re=()=>runEngine(FEAT_CACHE[STATE.map.id],false);
  $('#selE').onchange=e=>{const id=+e.target.value;if(id&&!STATE.ban.includes(id)&&!STATE.enemy.includes(id)&&STATE.enemy.length<mpN){STATE.enemy.push(id);STATE.lock=STATE.lock.filter(x=>x!==id)}re()};
  $('#selL').onchange=e=>{const id=+e.target.value;if(id&&!STATE.lock.includes(id)&&STATE.lock.length<mpN)STATE.lock.push(id);re()};
  // 밴은 양 팀 모두 사용 불가 → 우리 고정 픽과 상대 픽에서도 뺀다
  $('#selB').onchange=e=>{const id=+e.target.value;if(id&&!STATE.ban.includes(id)){STATE.ban.push(id);STATE.lock=STATE.lock.filter(x=>x!==id);STATE.enemy=STATE.enemy.filter(x=>x!==id)}re()};
  res.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const [c,id]=b.dataset.rm.split(':');const k={e:'enemy',m:'lock',x:'ban'}[c];STATE[k]=STATE[k].filter(x=>x!==+id);re()});
  res.querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>{const i=+b.dataset.alt;const L=R.list.slice();[L[0],L[i]]=[L[i],L[0]];renderResult({...R,list:L},mp,dm,feat);res.scrollIntoView({behavior:'smooth'})});
}

/* 배경 파티클 */
(function(){const c=$('#fx'),x=c.getContext('2d');let W,H,ps=[];const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
  for(let i=0;i<60;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.5,v:Math.random()*.4+.1,h:Math.random()<.5?48:265});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const f=()=>{x.clearRect(0,0,W,H);const g=x.createRadialGradient(W*.8,0,0,W*.8,0,W*.7);g.addColorStop(0,'rgba(155,92,255,.18)');g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,W,H);
    ps.forEach(p=>{p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}x.fillStyle=`hsla(${p.h},100%,65%,.55)`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(f)};f()})();
boot();
</script>
