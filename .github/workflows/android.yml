name: Android
on:
  push:
    branches: ['main', 'claude/**']
    paths: ['android/**', 'engine/**', 'tests/engine-regression/**', 'tests/app-fixtures/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: core 테스트(Node 엔진 일치) · lint · APK 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with: { name: brawl-assistant-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: android-reports, path: 'android/**/build/reports' }

  device-tests:
    name: 에뮬레이터 계측 테스트 (JavaScriptSandbox · BitmapFactory 엔진 일치)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM 사용 설정
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: android-device-test-reports, path: android/app/build/reports/androidTests }
